# Project-wide tool configuration.
#
# Line length is pinned to 88 everywhere (flake8, black, isort) to match the
# max_line_length already declared for Python files in .editorconfig. Without
# this, flake8 would fall back to its 79-character default and flag black's
# own output.

[flake8]
max-line-length = 88
# E203 (whitespace before ':') and W503 (line break before binary operator)
# conflict with black's formatting; both are PEP 8-compliant as black emits
# them.
extend-ignore = E203, W503
exclude =
    .git,
    __pycache__,
    venv,
    env,
    build,
    dist,
    htmlcov,
    .pytest_cache

[isort]
profile = black
line_length = 88

[mypy]
python_version = 3.10
warn_unused_configs = True
disallow_untyped_defs = True
warn_return_any = True
no_implicit_optional = True

# The starter modules predate this project's type-hint standard and are kept
# unmodified; new code in flashcards/ is held to disallow_untyped_defs.
[mypy-utils.*]
disallow_untyped_defs = False

[mypy-tests.*]
disallow_untyped_defs = False

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

[coverage:run]
branch = True
omit =
    tests/*
    setup.py

[coverage:report]
exclude_lines =
    pragma: no cover
    if __name__ == .__main__.:
    raise NotImplementedError
    if TYPE_CHECKING:
